[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alsense"
version = "0.1.0"
description = "Reproducible ALSense data and baseline-model foundation"
requires-python = ">=3.11"
dependencies = ["joblib>=1.3", "numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

